name: Generate Windows Shaders

on:
  workflow_dispatch:

jobs:
  shaders:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build gpui_windows
        shell: pwsh
        run: |
          cargo build --release -p gpui_windows --target x86_64-pc-windows-msvc

      - name: Find generated shaders
        shell: pwsh
        run: |
          Get-ChildItem -Path target -Filter shaders_bytes.rs -Recurse |
            ForEach-Object {
              Write-Host "Found: $($_.FullName)"
              Get-Content $_.FullName | Select-Object -First 10
            }

      - name: Upload generated shaders
        uses: actions/upload-artifact@v4
        with:
          name: windows-shaders
          path: target/x86_64-pc-windows-msvc/release/build/gpui_windows-*/out/shaders_bytes.rs
          if-no-files-found: error
